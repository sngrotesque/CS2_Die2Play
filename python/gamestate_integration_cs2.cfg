"CS2_Die2Play"
{
    "uri"                "http://127.0.0.1:23333" // 服务器地址和端口
    "timeout"            "5.0"  // 超时时间，如果服务器超时之前未响应游戏丢弃此请求。
    "buffer"             "0.0"  // 用于合并短时间内的多次事件，减少请求数量。设置为 0.0 不合并。
    "throttle"           "0.5"  // 节流阀，最快每{throttle}秒发一次更新。
    "heartbeat"          "1.0"  // 心跳包每{heartbeat}秒发一次（这个必须要有且必须短）。
    "data" {                    // 数据段（1为真，0为假）
        "provider"       "1"    // 包含游戏提供者的信息（如SteamId、版本号、时间戳等）。
        "map"            "1"    // 当前地图信息（如地图名、回合数等）。
        "round"          "1"    // 当前回合状态（如CT、T）。
        "player_id"      "1"    // 玩家身份信息（如SteamId、名字），用于判断玩家身份防止看队友的时候也跳转。
        "player_state"   "1"    // 关键，当前玩家状态（包含生命值、护甲值、金钱等）。
    }
}
